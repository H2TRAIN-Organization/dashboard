$kind: http-request
name: '14d-admin-study'
method: GET
url: '{{baseUrl}}/api/study?period=365d'
order: 14400
headers:
  - key: Cookie
    value: '{{admin_cookie}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('expected status', () => pm.response.to.have.status(200));
      pm.test('contract', () => pm.expect(pm.response.json().sources.kubios).to.eql('ready'));
    language: text/javascript
settings:
  disableCookies: true
