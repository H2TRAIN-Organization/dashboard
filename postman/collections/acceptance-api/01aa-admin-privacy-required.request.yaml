$kind: http-request
name: '01aa-admin-privacy-required'
method: GET
url: '{{baseUrl}}/api/users'
order: 1050
headers:
  - key: Cookie
    value: '{{admin_cookie}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('expected status', () => pm.response.to.have.status(403));
      pm.test('contract', () => pm.expect(pm.response.json().error.code).to.eql('PRIVACY_ACTION_REQUIRED'));
    language: text/javascript
settings:
  disableCookies: true
